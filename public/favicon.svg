<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background with dark navy rounded tile -->
  <rect width="64" height="64" rx="16" fill="#070D1C"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#223254" stroke-width="1.5"/>

  <!-- Glowing Lime Accent Element (WoonData brand indicator) -->
  <circle cx="48" cy="16" r="4.5" fill="#C9F31D"/>

  <!-- Architectural Building & Housing Silhouette (Bold & clear at small zoom) -->
  <g filter="url(#glow)">
    <!-- Main Tower -->
    <path d="M26 18 C26 16.34 27.34 15 29 15 L43 15 C44.66 15 46 16.34 46 18 L46 49 L26 49 Z" fill="#FFFFFF"/>
    
    <!-- Left Lower Building with modern slope / pitch -->
    <path d="M14 28 C14 26.34 15.34 25 17 25 L26 25 L26 49 L14 49 Z" fill="#E2E8F0"/>

    <!-- Dynamic Lime Accent Roof line / beam -->
    <rect x="23" y="13" width="26" height="4" rx="2" fill="#C9F31D"/>

    <!-- High-contrast cutouts for architectural windows -->
    <!-- Tower windows -->
    <rect x="30" y="21" width="4" height="4" rx="1" fill="#070D1C"/>
    <rect x="38" y="21" width="4" height="4" rx="1" fill="#070D1C"/>
    
    <rect x="30" y="29" width="4" height="4" rx="1" fill="#070D1C"/>
    <rect x="38" y="29" width="4" height="4" rx="1" fill="#070D1C"/>

    <rect x="30" y="37" width="4" height="4" rx="1" fill="#070D1C"/>
    <rect x="38" y="37" width="4" height="4" rx="1" fill="#070D1C"/>

    <!-- Side building windows -->
    <rect x="18" y="31" width="4" height="4" rx="1" fill="#070D1C"/>
    <rect x="18" y="39" width="4" height="4" rx="1" fill="#070D1C"/>
    
    <!-- Ground line -->
    <rect x="11" y="48" width="42" height="3" rx="1.5" fill="#C9F31D"/>
  </g>
</svg>
